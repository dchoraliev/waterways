# GitLab CI/CD Pipeline for Waterways App
# Optimized for speed with parallel jobs and efficient caching

# Define the Node.js Docker image to use for all jobs
image: node:20

# Use interruptible to cancel outdated pipelines when new commits are pushed
default:
  interruptible: true

# Create only one pipeline per commit.
# If a branch has an open MR, prefer the MR pipeline and skip the duplicate push pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# Define stages - combine check stages to reduce overhead
stages:
  - install
  - verify
  - build

# Global cache configuration - use push/pull policy for better performance
cache:
  key:
    files:
      - yarn.lock
  paths:
    - node_modules/
    - apps/*/node_modules/
    - packages/*/node_modules/
  policy: pull

# Job 1: Install Dependencies - only this job pushes to cache
install_dependencies:
  stage: install
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    policy: pull-push
  script:
    - yarn install --frozen-lockfile --prefer-offline
  artifacts:
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    expire_in: 2 hour
    untracked: false

# Job 2: Lint (runs in parallel with type-check and test)
lint:
  stage: verify
  needs:
    - install_dependencies
  script:
    - yarn lint

# Job 3: Type-Check (runs in parallel with lint and test)
type_check:
  stage: verify
  needs:
    - install_dependencies
  script:
    - yarn type-check

# Job 4: Test (runs in parallel with lint and type-check)
test:
  stage: verify
  needs:
    - install_dependencies
  script:
    - yarn test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 30 days

# ──────────────────────────────────────────────
# Build Stage - EAS iOS Development Build
# ──────────────────────────────────────────────
# Triggered manually or on pushes to main/develop.
# Requires EXPO_TOKEN CI/CD variable set in GitLab
# (Settings > CI/CD > Variables).

.eas_build_base:
  stage: build
  interruptible: false
  needs:
    - job: install_dependencies
      optional: true
  before_script:
    - yarn install --frozen-lockfile --prefer-offline
    - npx eas-cli --version
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    policy: pull

# iOS Development Build (device) — manual trigger
eas_build_ios_shared:
  extends: .eas_build_base
  resource_group: eas-ios-development-shared
  variables:
    APP_VARIANT: shared
    APP_DISPLAY_NAME: Waterways
    IOS_BUNDLE_ID: com.waterways.mobile
    EXPO_SCHEME: waterways
  script:
    - cd apps/mobile
    - >-
      EAS_SKIP_AUTO_FINGERPRINT=1 npx eas-cli build --non-interactive --platform ios --profile development
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never

# iOS Development Sandbox Build (device) — isolated app variant for feature work
eas_build_ios_sandbox:
  extends: .eas_build_base
  variables:
    APP_VARIANT: sandbox
    APP_DISPLAY_NAME: Waterways Sandbox
    IOS_BUNDLE_ID: com.waterways.mobile.sandbox
    EXPO_SCHEME: waterways-sandbox
  script:
    - cd apps/mobile
    - >-
      EAS_SKIP_AUTO_FINGERPRINT=1 npx eas-cli build --non-interactive --platform ios --profile development_sandbox
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
      when: manual
      allow_failure: true
    - when: never
