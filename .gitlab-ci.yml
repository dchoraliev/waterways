# GitLab CI/CD Pipeline for Waterways App
# Optimized for speed with parallel jobs and efficient caching

# Define the Node.js Docker image to use for all jobs
image: node:20

# Use interruptible to cancel outdated pipelines when new commits are pushed
default:
  interruptible: true

# Define stages - combine check stages to reduce overhead
stages:
  - install
  - verify

# Global cache configuration - use push/pull policy for better performance
cache:
  key:
    files:
      - yarn.lock
  paths:
    - node_modules/
    - apps/*/node_modules/
    - packages/*/node_modules/
  policy: pull

# Job 1: Install Dependencies - only this job pushes to cache
install_dependencies:
  stage: install
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    policy: pull-push
  script:
    - yarn install --frozen-lockfile --prefer-offline
  artifacts:
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    expire_in: 1 hour
    untracked: false

# Job 2: Lint (runs in parallel with type-check and test)
lint:
  stage: verify
  needs:
    - install_dependencies
  script:
    - yarn lint

# Job 3: Type-Check (runs in parallel with lint and test)
type_check:
  stage: verify
  needs:
    - install_dependencies
  script:
    - yarn type-check

# Job 4: Test (runs in parallel with lint and type-check)
test:
  stage: verify
  needs:
    - install_dependencies
  script:
    - yarn test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 30 days
